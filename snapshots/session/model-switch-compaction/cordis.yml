# The second request selects a smaller model before its header is committed.

- id: agent-instructions
  disabled: true

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 100000
        maxTokens: 1000
      - id: deepseek-v4-pro
        contextWindow: 8622
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'
    - id: model-switch-compaction-driver
      name: './driver.mjs'
