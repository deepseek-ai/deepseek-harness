- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: system-prompt
  config:
    personaPrefix: 'Deployment instructions: read task.txt.'
    personaSuffix: Deployment suffix.

- insert:
    - id: persona-section-overrides
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/persona-section-overrides.ts'
