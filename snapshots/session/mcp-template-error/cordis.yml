- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-flash

- insert:
    - id: mcp-template-error
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: protected
        url: !!js process.env.DSH_MCP_DEMO_URL
        headers:
          Authorization: 'Bearer ${env:DSH_MCP_TEMPLATE_TOKEN}'
        expandTemplates: true
        failOnStartupError: true
        reconnect:
          enabled: false
