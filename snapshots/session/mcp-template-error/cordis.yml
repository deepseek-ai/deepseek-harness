- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-flash

# The template resolves through the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-template-error
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [credentials]
      config:
        transport: streamable-http
        serverName: protected
        url: !!js process.env.DSH_MCP_DEMO_URL
        headers:
          Authorization: 'Bearer ${credential:DSH_MCP_TEMPLATE_TOKEN}'
        expandTemplates: true
        failOnStartupError: true
        reconnect:
          enabled: false
