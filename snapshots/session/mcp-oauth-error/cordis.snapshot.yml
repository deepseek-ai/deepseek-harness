- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max

# The OAuth grant lives in the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-oauth-error
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [credentials]
      config:
        transport: streamable-http
        serverName: protected
        url: !!js process.env.DSH_MCP_DEMO_URL
        oauth:
          credentialKey: mcp-client/snapshot
        expandTemplates: true
        failOnStartupError: true
        reconnect:
          enabled: false
