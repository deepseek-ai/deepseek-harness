# Test-only patch over the shipped headless profile. The real base bundle
# supplies the goal domain, model tools, and agent runtime.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: goal
  config:
    defaultMaxGoalRounds: 11

- id: agent-loop
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: cli-mock-llm
      name: '../../../../../test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

    - id: seed-goal
      name: './seed-goal.ts'

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
