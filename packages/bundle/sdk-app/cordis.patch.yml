# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

- id: tool-plugin-manager
  disabled: false

# The packaged carrier supplies a default; DSH_PRIMARY_RUNTIME overrides it,
# including an empty-string opt-out. Each row can be patched independently.
# Office skills always load. With a primary runtime they use its Office assets,
# Node executable, and Python environment; without one each path expression
# evaluates to `undefined`, which the skill-office schema treats as unset, so
# the packaged assets, the current Node executable, the package's Kit CLI, and
# the user's Python apply. DSH_BUNDLED_OFFICE_SKILLS, DSH_BUNDLED_OFFICE_NODE,
# and DSH_BUNDLED_OFFICE_CLI override the paths; an empty CLI disables it.
- insert:
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME)"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '')"

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        assetRoot: !!js "process.env.DSH_BUNDLED_OFFICE_SKILLS ?? ((process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME) ? process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME, '..', 'office-skills') : undefined)"
        cli: !!js "process.env.DSH_BUNDLED_OFFICE_CLI === '' ? false : process.env.DSH_BUNDLED_OFFICE_CLI"
        node: !!js "process.env.DSH_BUNDLED_OFFICE_NODE ?? ((process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME) ? process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME, 'dependencies', 'node', 'bin', process.platform === 'win32' ? 'node.exe' : 'node') : undefined)"
        pythonEnvironment: !!js "(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME) ? undefined : 'user'"

# Share native desktop tools and model context without starting a Web server.
- insert:
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
      inject: [sdkSessionActivation]

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: tool-schedule
      name: '@deepseek-ai/dsh-tool-schedule'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: present
      name: '@deepseek-ai/dsh-tool-present'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: deliverable-file-references
      name: '@deepseek-ai/dsh-deliverable-file-references'
