# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

- id: tool-plugin-manager
  disabled: false

# DSH_PRIMARY_RUNTIME names the primary runtime; the packaged launcher fills it
# from its download cache when unset, and an empty value opts out. Each row can
# be patched independently. The Office tools always load; the Office skills and
# the runtime's Python environment load only with a primary runtime, and the
# skills then use its Office assets. A nonempty DSH_BUNDLED_OFFICE_SKILLS
# overrides the skill directory.
- insert:
    - id: office-kit
      name: '@deepseek-ai/dsh-office-kit'
      config:
        outputDirectory: !!js dshHomePath('office-kit', 'outputs')

    # The Office tools stay registered without Kit; calls report the service's unavailable error.
    - id: tool-office
      name: '@deepseek-ai/dsh-tool-office'

    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      disabled: !!js "!process.env.DSH_PRIMARY_RUNTIME"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? '')"

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: !!js "!process.env.DSH_PRIMARY_RUNTIME"
      config:
        assetRoot: !!js "process.env.DSH_BUNDLED_OFFICE_SKILLS || process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? '', '..', 'office-skills')"

# Share native desktop tools and model context without starting a Web server.
- insert:
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
      inject: [sdkSessionActivation]

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: tool-schedule
      name: '@deepseek-ai/dsh-tool-schedule'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: present
      name: '@deepseek-ai/dsh-tool-present'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: deliverable-file-references
      name: '@deepseek-ai/dsh-deliverable-file-references'
