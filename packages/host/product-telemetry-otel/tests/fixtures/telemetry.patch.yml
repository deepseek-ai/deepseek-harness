- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@deepseek-ai/dsh-host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.DSH_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: dsh-telemetry-test
        serviceVersion: !!js process.env.DSH_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 60000
