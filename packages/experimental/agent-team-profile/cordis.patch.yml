# Experimental Agent Teams profile layer. Apply after dsh-base: teammates are
# subagents, so the base delegation and messaging tools stay mounted and
# this layer only adds the Team task board, task guidance, and panel.

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxTasks: 256

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
