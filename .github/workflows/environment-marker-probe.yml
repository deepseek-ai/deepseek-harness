# Temporary manual probe for GitHub Environment behavior. Dispatch only: it has
# no pull_request or push trigger, checks out no code, uses no action, and
# requests no token permissions. The environment name and the marker secret name
# are literals. This workflow changes no environment setting.
#
# workflow_dispatch requires this file on the default branch, so every scenario
# runs only after this file is merged. The operator verifies the canonical refs
# and the workflow blob through the API before dispatching.
#
# A: ref master, mode protected. The protected job runs and the marker must be
#    true.
# B: ref ci/env-probe-8722-abc, mode protected. The identical protected job must
#    be rejected by the environment deployment branch policy before any step
#    runs. A red run alone is not evidence of rejection: the rejection must come
#    from the environment protection rule, and any executed protected step,
#    including the marker report step, is an experiment failure rather than a
#    rejection.
# C: ref ci/env-probe-8722-abc, mode control. The control job has no
#    environment, so the marker must be false.
name: environment-marker-probe
run-name: environment-marker-probe ${{ inputs.mode }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          protected runs the environment job (A at master, B at the probe
          branch); control runs the same job without an environment (C at the
          probe branch).
        required: true
        type: choice
        options:
          - protected
          - control

permissions: {}

jobs:
  protected:
    name: protected probe
    if: inputs.mode == 'protected'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Literal environment. No input selects or overrides it.
    environment: weighted-approval-probe-8722-abc
    steps:
      - name: Report marker presence
        env:
          MARKER_PRESENT: ${{ secrets.DSH_ENV_PROBE_8722_ABC != '' }}
        run: |
          echo "DSH_ENV_PROBE_8722_ABC present: ${MARKER_PRESENT}"
      - name: Assert marker present
        env:
          MARKER_PRESENT: ${{ secrets.DSH_ENV_PROBE_8722_ABC != '' }}
        run: test "${MARKER_PRESENT}" = "true"

  control:
    name: control probe
    if: inputs.mode == 'control'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Report marker presence
        env:
          MARKER_PRESENT: ${{ secrets.DSH_ENV_PROBE_8722_ABC != '' }}
        run: |
          echo "DSH_ENV_PROBE_8722_ABC present: ${MARKER_PRESENT}"
      - name: Assert marker absent
        env:
          MARKER_PRESENT: ${{ secrets.DSH_ENV_PROBE_8722_ABC != '' }}
        run: test "${MARKER_PRESENT}" = "false"
