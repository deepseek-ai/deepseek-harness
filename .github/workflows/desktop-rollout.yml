name: Publish Desktop · Rollout & Website

run-name: Rollout Desktop package ${{ inputs.package_run_id }} / attempt ${{ inputs.package_run_attempt }} · ${{ inputs.rollout_percentage && format('{0}%', inputs.rollout_percentage) || 'website only' }}

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: '已经完成首次 COS 发布的 Package Desktop run ID'
        type: string
        required: true
      rollout_percentage:
        description: '目标放量比例：0–100 整数，只允许保持或增加；留空只发布官网'
        type: string
        required: false
        default: ''
      upload_website:
        description: '上传已发布版本的官网安装包并刷新缓存（仅 production，不要求放量达到 100%）'
        type: boolean
        default: false
        required: true
      package_run_attempt:
        description: '已发布的原打包 attempt；默认 1，请核对原 run'
        type: string
        required: true
        default: '1'

permissions:
  contents: read
  actions: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.route.outputs.selection }}
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - name: Require master for publication
        run: node -e "if (process.env.GITHUB_REF !== 'refs/heads/master') throw new Error('Desktop publication must be dispatched from master')"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Reject debugging packages before dependency installation
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop-publisher/src/preflight-desktop-publish.mjs
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: pnpm --filter @deepseek-ai/dsh-desktop-publisher --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve original package and machine
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_PUBLISH_RUNNERS: ${{ vars.DESKTOP_PUBLISH_RUNNERS }}
          DESKTOP_PACKAGE_ATTEMPT: ${{ steps.preflight.outputs.attempt }}
        working-directory: apps/desktop-publisher
        run: node --import tsx src/resolve-desktop-publish-ci.ts

  prepare:
    needs: route
    runs-on: [self-hosted, '${{ needs.route.outputs.runner }}']
    timeout-minutes: 30
    outputs:
      route: ${{ steps.local.outputs.route }}
      preset: ${{ steps.local.outputs.preset }}
      rollout-requested: ${{ steps.check.outputs.rollout-requested }}
      approval: ${{ steps.check.outputs.approval }}
      website-approval: ${{ steps.check.outputs.website-approval }}
      website-destination: ${{ steps.check.outputs.website-destination }}
      label: ${{ steps.check.outputs.label }}
    env:
      DESKTOP_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
      DESKTOP_PACKAGE_SELECTION: ${{ needs.route.outputs.selection }}
      DESKTOP_UPLOAD_WEBSITE: ${{ inputs.upload_website }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: false
          path: desktop-rollout
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: desktop-rollout/package.json
          dest: ${{ runner.temp }}/publish-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check local publication configuration before dependency installation
        working-directory: desktop-rollout
        run: node apps/desktop-publisher/src/preflight-desktop-publish-local.mjs
      - run: pnpm --filter @deepseek-ai/dsh-desktop-publisher --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
        working-directory: desktop-rollout
      - name: Resolve retained package and approval environment
        id: local
        working-directory: desktop-rollout/apps/desktop-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx src/publish-desktop-rollout-ci.ts route
      - name: Verify initial publication and metadata without upload credentials
        id: check
        working-directory: desktop-rollout/apps/desktop-publisher
        env:
          DESKTOP_PUBLISH_ROUTE: ${{ steps.local.outputs.route }}
        run: node --import tsx src/publish-desktop-rollout-ci.ts check

  publish:
    name: Approve ${{ needs.prepare.outputs.label }}
    needs: [route, prepare]
    if: needs.prepare.outputs.rollout-requested == 'true'
    runs-on: [self-hosted, '${{ needs.route.outputs.runner }}']
    environment: ${{ needs.prepare.outputs.preset == 'production' && 'desktop-production' || 'desktop-test' }}
    concurrency:
      group: desktop-publish-${{ needs.route.outputs.runner }}-${{ needs.prepare.outputs.preset }}
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      DESKTOP_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
      DESKTOP_ROLLOUT_APPROVAL: ${{ needs.prepare.outputs.approval }}
      DESKTOP_UPLOAD_WEBSITE: ${{ inputs.upload_website }}
      DESKTOP_PUBLISH_ROUTE: ${{ needs.prepare.outputs.route }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: false
          path: desktop-rollout
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: desktop-rollout/package.json
          dest: ${{ runner.temp }}/publish-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check local publication configuration before dependency installation
        working-directory: desktop-rollout
        run: node apps/desktop-publisher/src/preflight-desktop-publish-local.mjs
      - run: pnpm --filter @deepseek-ai/dsh-desktop-publisher --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
        working-directory: desktop-rollout
      - name: Verify initial publication and metadata without upload credentials
        id: check
        working-directory: desktop-rollout/apps/desktop-publisher
        run: node --import tsx src/publish-desktop-rollout-ci.ts check
      - name: Apply rollout to the published feed
        id: publish
        working-directory: desktop-rollout/apps/desktop-publisher
        run: node --import tsx src/publish-desktop-rollout-ci.ts apply
      - name: Retain publication audit
        continue-on-error: true
        if: always() && steps.publish.outputs.record != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.publish.outputs.record }}/
          if-no-files-found: error
          retention-days: 30

  upload-website-installer:
    name: Website ${{ needs.prepare.outputs.label }}
    needs: [route, prepare, publish]
    if: ${{ !cancelled() && inputs.upload_website && needs.prepare.result == 'success' && needs.prepare.outputs.preset != 'test' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.prepare.outputs.rollout-requested == 'false')) }}
    runs-on: [self-hosted, '${{ needs.route.outputs.runner }}']
    environment: desktop-production
    timeout-minutes: 60
    concurrency:
      group: desktop-website-upload-${{ needs.prepare.outputs.website-destination }}
      cancel-in-progress: false
    env:
      DESKTOP_PUBLISH_ROUTE: ${{ needs.prepare.outputs.route }}
      DESKTOP_WEBSITE_APPROVAL: ${{ needs.prepare.outputs.website-approval }}
      DESKTOP_ROLLOUT_APPROVAL: ${{ needs.prepare.outputs.approval }}
      DESKTOP_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
      DESKTOP_UPLOAD_WEBSITE: ${{ inputs.upload_website }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: false
          path: website-rollout
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: website-rollout/package.json
          dest: ${{ runner.temp }}/website-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check local publication configuration
        working-directory: website-rollout
        run: node apps/desktop-publisher/src/preflight-desktop-publish-local.mjs
      - run: pnpm --filter @deepseek-ai/dsh-desktop-publisher --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
        working-directory: website-rollout
      - name: Upload website installer
        id: website
        working-directory: website-rollout/apps/desktop-publisher
        run: node --import tsx src/publish-desktop-rollout-ci.ts website-upload
      - name: Archive website feed verification
        if: always() && steps.website.outputs.rollout-record != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website-feed-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.website.outputs.rollout-record }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Archive website publication diagnostics
        if: always() && steps.website.outputs.record != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.website.outputs.record }}/
          if-no-files-found: warn
          retention-days: 30

  purge-website-installer:
    needs: [route, prepare, upload-website-installer]
    if: ${{ !cancelled() && inputs.upload_website && needs.prepare.outputs.preset != 'test' && needs.upload-website-installer.result == 'success' }}
    runs-on: [self-hosted, '${{ needs.route.outputs.runner }}']
    timeout-minutes: 60
    concurrency:
      group: desktop-website-purge-${{ needs.prepare.outputs.website-destination }}
      cancel-in-progress: false
    env:
      DESKTOP_PUBLISH_ROUTE: ${{ needs.prepare.outputs.route }}
      DESKTOP_WEBSITE_APPROVAL: ${{ needs.prepare.outputs.website-approval }}
      DESKTOP_UPLOAD_WEBSITE: ${{ inputs.upload_website }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: false
          path: website-rollout
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: website-rollout/package.json
          dest: ${{ runner.temp }}/website-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check local publication configuration
        working-directory: website-rollout
        run: node apps/desktop-publisher/src/preflight-desktop-publish-local.mjs
      - run: pnpm --filter @deepseek-ai/dsh-desktop-publisher --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
        working-directory: website-rollout
      - name: Recover and observe website cache purge
        id: website
        working-directory: website-rollout/apps/desktop-publisher
        run: node --import tsx src/publish-desktop-rollout-ci.ts website-purge
      - name: Archive website publication diagnostics
        if: always() && steps.website.outputs.record != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website-purge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.website.outputs.record }}/
          if-no-files-found: warn
          retention-days: 30
