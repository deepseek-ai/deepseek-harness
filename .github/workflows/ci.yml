          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      # The persistent self-hosted pool keeps ~/.cache between jobs on its own
      # layout, so the archive cache follows the hosted-only pnpm store guard.
      - name: Restore verified bubblewrap archive
        id: bubblewrap-cache
        if: vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Save verified bubblewrap archive
        if: (vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]') && steps.bubblewrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      # Restore the build job's output after the install, so no install or
      # postinstall step can replace restored files. The fixed artifact name
      # resolves within this run, including a re-run of this job alone.
      - name: Download build output
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack build output
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/build-output/build-output.tar.zst"
          # -m stamps restored files with the extraction time: newer than this
          # checkout and never in the future. Build-time mtimes ahead of the
          # clock make HMR treat freshly loaded lib/ modules as changed.
          zstd -dc -T0 "$archive" | tar -xmf -
