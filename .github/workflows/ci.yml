      # No gate reads the Office runtime output, so it builds beside the gates.
      # GitHub runners keep a background process started in one step alive for
      # the later steps of the same job; the final step collects its status.
      - name: Start the Linux Office runtime build
        id: office-runtime
        run: |
          (
            status=0
            CI=true pnpm run prepare:primary-runtime --target linux-x64 --output "$RUNNER_TEMP/office-runtime" --cache "$RUNNER_TEMP/office-runtime-downloads" || status=$?
            echo "$status" > "$RUNNER_TEMP/office-runtime.status"
          ) > "$RUNNER_TEMP/office-runtime.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/office-runtime.pid"

      - name: Run compatibility, snapshot, and artifact gates
        run: pnpm run check:ci:consumers-prebuilt

      - name: Wait for the Linux Office runtime
        if: ${{ !cancelled() && steps.office-runtime.outcome == 'success' }}
        run: |
          pid=$(cat "$RUNNER_TEMP/office-runtime.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/office-runtime.log"
          status=$(cat "$RUNNER_TEMP/office-runtime.status" 2>/dev/null || echo missing)
          if [[ "$status" != 0 ]]; then
            echo "::error::Linux Office runtime build failed with status $status"
            exit 1
          fi

