        run: |
          deps=()
          if [[ "$PLAYWRIGHT_INSTALL_MODE" == with-deps ]]; then deps=(--with-deps); fi
          (
            status=0
            pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install "${deps[@]}" chromium webkit || status=$?
            echo "$status" > "$RUNNER_TEMP/playwright-install.status"
          ) > "$RUNNER_TEMP/playwright-install.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/playwright-install.pid"

      # Restore the build job's output after the install, so no install or
      # postinstall step can replace restored files. The fixed artifact name
      # resolves within this run, including a re-run of this job alone.
      - name: Download build output
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack build output
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/build-output/build-output.tar.zst"
          # -m stamps restored files with the extraction time: newer than this
          # checkout and never in the future. Build-time mtimes ahead of the
          # clock make HMR treat freshly loaded lib/ modules as changed.
          zstd -dc -T0 "$archive" | tar -xmf -
          test -f apps/cli/lib/bin.js && test -f apps/web/dist/index.html && test -f .dsh-build/client-build-environment.json

      - name: Wait for Playwright browsers
        run: |
          pid=$(cat "$RUNNER_TEMP/playwright-install.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/playwright-install.log"
          status=$(cat "$RUNNER_TEMP/playwright-install.status" 2>/dev/null || echo missing)
          if [[ "$status" != 0 ]]; then
            echo "::error::Playwright browser install failed with status $status"
            exit 1
          fi

      - name: Run web browser snapshot shard
        run: pnpm run check:ci:web-snapshot-prebuilt

  node-compat:
    needs: publisher-isolated
    if: github.event_name == 'pull_request'
    # Under the selfhosted leg this job admits only repository-owned PR code
    # to the persistent shared VM; the blacksmith branch targets ephemeral
    # runners and carries none of those predicates.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404'
          || vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.head.repo.fork == false
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || matrix.runner }}
    name: ${{ matrix.name }}
    env:
      DSH_GATE_CONCURRENCY: ${{ matrix.gate_concurrency }}
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      # A failed smoke aborts the remaining compatibility gates instead of
      # letting the build-backed legs run against an already-red aggregate.
      DSH_GATE_FAIL_FAST: '1'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Pin the supported floor, whose internal loader is v1. Primary
          # jobs track latest 24 and exercise v2, introduced in 24.12.0.
          - node: '24.9'
            name: node 24.9
            runner: ubuntu-latest
            gate_concurrency: '1'
          - node: 26
            name: node 26
            runner: ubuntu-latest
            gate_concurrency: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Shared hosts keep version installs and generated caches inside runner temp.
      - name: Isolate compatibility caches
        if: runner.environment == 'self-hosted'
        run: |
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"
          echo "npm_config_devdir=$RUNNER_TEMP/node-gyp" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        env:
          # The runner overwrites RUNNER_* step env before starting JavaScript actions.
          NODE_OPTIONS: ${{ runner.environment == 'self-hosted' && '--import=./scripts/ci-compatible-toolcache.mjs' || '' }}
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          package-manager-cache: false

      - name: Verify isolated Node installation
        if: runner.environment == 'self-hosted'
        run: |
          node_path=$(node -p process.execPath)
          echo "Node executable: $node_path"
          case "$node_path" in
            "$RUNNER_TEMP/node-compat-toolcache/"*) ;;
            *) echo "::error::Node compatibility installation is outside runner temp"; exit 1 ;;
          esac

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The persistent self-hosted pool keeps ~/.cache between jobs on its own
      # layout, so the archive cache follows the hosted-only pnpm store guard.
      - name: Restore verified bubblewrap archive
        id: bubblewrap-cache
        if: vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Save verified bubblewrap archive
        if: (vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]') && steps.bubblewrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      - name: Run compatibility smokes
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run check:node-compat

      # Kept out of the gate aggregate: the shape a Node release carries only
      # changes with the Node version, so this belongs to the version matrix
      # rather than to every commit's checks.
      - name: Check Loader internal shape detection
        run: pnpm exec vitest run packages/boot/app-boot/tests/loader-shape.compat.spec.ts

  # Single stable required check for branch protection: require "all checks
  # passed" instead of enumerating matrix legs whose names change as lanes and
  # node versions evolve. Every blocking job in THIS workflow must be listed in
  # `needs` or be needed by a listed job: a failed node-24-coverage shard skips
  # node-24-coverage-report, and a skipped need fails this verdict. `needs`
  # cannot cross workflow files: native Windows jobs report
  # the separate "windows checks passed" verdict from ci-windows.yml, Python
  # jobs report "python checks passed" from ci-python.yml, and Wine plus the
  # master-only runtime targets live in ci-master.yml.
  # An explicit status function runs the verdict after failed/skipped needs
  # without keeping a cancelled workflow alive for an obsolete verdict.
  all-checks-passed:
    name: all checks passed
    # This bookkeeping-only verdict must not depend on custom-pool
    # provisioning — and under Linux failover it follows the same selector as
    # the worker jobs it aggregates, so a standard-hosted outage cannot strand
    # the branch-protection verdict either. It retargets with the Linux switch
    # (DSH_CI_FAILOVER_LINUX), not the Windows one, because it aggregates the
    # required Linux workers and runs on the vm-backup pool. Under the
    # 'blacksmith' value the verdict shares Blacksmith's pool with its workers
    # through the same selector, so a Blacksmith outage strands both together —
    # the accepted consequence of the explicit opt-in switch.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404'
          || vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || 'ubuntu-latest' }}
    needs: [publisher-isolated, node-24, node-24-coverage-report, node-24-lint, node-24-bench, node-24-build, node-24-consumers, node-24-web-snapshot, node-compat]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
