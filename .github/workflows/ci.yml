        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The persistent self-hosted pool keeps ~/.cache between jobs on its own
      # layout, so the archive cache follows the hosted-only pnpm store guard.
      - name: Restore verified bubblewrap archive
        id: bubblewrap-cache
        if: vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Save verified bubblewrap archive
        if: (vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]') && steps.bubblewrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dsh-ci/bubblewrap
          key: bubblewrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-bubblewrap.sh') }}

      # Ubuntu HTTP archive mirrors can stall for tens of seconds per package
      # (Blacksmith lists http://azure.archive.ubuntu.com first), so every
      # ephemeral runner fetches the archive over HTTPS before Playwright's apt.
      - name: Use HTTPS for Ubuntu archives
        if: vars.DSH_CI_FAILOVER_LINUX != 'selfhosted' || github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          apt = Path('/etc/apt')
          sources = [apt / 'sources.list', apt / 'blacksmith-ubuntu-mirrors.txt',
                     *(apt / 'sources.list.d').glob('*.list'),
                     *(apt / 'sources.list.d').glob('*.sources')]
          for source in sources:
              if source.is_file():
                  source.write_text(re.sub(
                      r'http://(?:[a-z0-9-]+\.)*(archive|security)\.ubuntu\.com/',
                      r'https://\1.ubuntu.com/', source.read_text()))
          PY

      # The browser install overlaps the artifact download and unpack. GitHub
      # runners keep a background process started in one step alive for the
      # later steps of the same job, and the wait step below collects its exit
      # status. The persistent VM image owns Playwright's Linux system packages,
      # so the failover pool skips apt instead of mutating the shared host.
