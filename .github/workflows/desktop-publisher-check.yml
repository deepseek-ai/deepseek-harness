name: Verify Desktop Publisher
on:
  pull_request:
    paths:
      - 'apps/desktop-publisher/**'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-publisher-check.yml'
      - '.github/workflows/desktop-rollout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install only publisher production dependencies
        run: pnpm --filter @deepseek-ai/dsh-desktop-publisher --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Load publisher without the Desktop or root development dependencies
        working-directory: apps/desktop-publisher
        run: node --import tsx tests/isolated-install.mjs
