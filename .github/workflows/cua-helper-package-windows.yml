name: Package CUA helper · Windows · x64

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: '包含 win-x64 helper ZIP 的产物编号'
        value: ${{ jobs.package.outputs.artifact-id }}
      run-id:
        description: '产物所属的构建运行编号'
        value: ${{ jobs.package.outputs.run-id }}

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      run-id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows CUA helper
        run: dotnet publish packages/experimental/cua-windows/native/entry/CuaWindows.csproj --configuration Release --runtime win-x64 --self-contained false --output dist/cua-helper-win-x64
      - name: Archive publish output
        run: Compress-Archive -Path dist/cua-helper-win-x64/* -DestinationPath dist/cua-helper-win-x64.zip
      - uses: actions/upload-artifact@v7.0.1
        id: upload
        with:
          name: cua-helper-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/cua-helper-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
