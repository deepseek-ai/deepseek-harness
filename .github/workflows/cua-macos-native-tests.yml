name: macOS CUA AX child recovery

on:
  pull_request:
    paths:
      - 'packages/experimental/cua-macos/native/**'
      - '.github/workflows/cua-macos-native-tests.yml'

permissions:
  contents: read

concurrency:
  group: cua-macos-native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify AX range recovery and native error classification
        run: >-
          python3 packages/experimental/cua-macos/native/tests/test_swift.py
          --filter 'AXObservedChildrenTests|batchFailuresPreservePermissionCommunicationAndStaleElementErrors|nodeRoleAndContainerChildrenRetainStructuralFailures'
      - name: Verify real AppKit window projection and actions
        run: python3 packages/experimental/cua-macos/native/tests/test_ax_projection.py
