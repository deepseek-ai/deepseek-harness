# The bonus notice scenario points the shipped account provider at a loopback
# Platform double. The scaffold substitutes {{origin}} after the listener binds,
# so no port is ever committed here. A long query interval isolates other notice
# interactions; the polling scenario advances the browser clock explicitly.
- id: deepseek-account
  config:
    platformOrigin: "{{origin}}"
    harnessOrigin: "{{origin}}"
    allowLoopbackHttp: true
# This scenario exercises the account launcher after initial setup.
- id: ui-settings-account
  config:
    step: done
    completion: completed
- id: ui-account-notifications
  config:
    notificationPollIntervalMs: 7200000
