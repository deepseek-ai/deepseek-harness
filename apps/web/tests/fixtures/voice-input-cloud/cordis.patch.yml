# The cloud dictation scenario points the shipped account provider's Platform and Harness origins and the
# cloud recognizer at one loopback double. The scenario substitutes {{origin}} after the listener binds, so no
# port is ever committed here.
- id: deepseek-account
  config:
    platformOrigin: "{{origin}}"
    harnessOrigin: "{{origin}}"
    allowLoopbackHttp: true
- id: ui-settings-account
  config:
    step: done
    completion: completed
# Automatic selection then has only the cloud recognizer to choose.
- id: speech-to-text-sensevoice
  disabled: true
- id: speech-to-text-deepseek
  config:
    endpoint: "{{origin}}/api/v0/asr/transcribe"
    allowLoopbackHttp: true
