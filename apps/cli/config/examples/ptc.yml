- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

# PTC mode exposes the pre-apply_patch tool set, as the Web ptc preset does.
- id: tool-fs
  config:
    applyPatch: false

# run_code already orchestrates tool calls in code, so PTC mode omits the
# separate workflow tool and its engine, as the Web ptc preset does.
- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true
