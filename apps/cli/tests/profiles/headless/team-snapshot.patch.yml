# Deterministic Agent Teams patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxTasks: 256

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

    - id: team-fixture-llm
      name: './tests/fixtures/team-llm.mjs'
